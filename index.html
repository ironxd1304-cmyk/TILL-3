<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TILL FAILURE - 3D Apparel Showcase</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Impact, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    overflow: hidden; background: #0a0a0c; color: #fff;
    position: fixed; inset: 0;
  }
  #canvas-container {
    position: fixed; inset: 0; z-index: 1; transition: background 0.8s ease;
    background: radial-gradient(circle at 50% 45%, #1c2541 0%, #070709 75%);
  }
  #bg-giant-text {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 0; font-size: 13vw; font-weight: 900; font-style: italic;
    line-height: 0.85; text-align: center; color: rgba(255,255,255,0.09); pointer-events: none;
    opacity: 0; transform: scale(0.9); transition: all 0.6s ease;
  }
  header {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: max(14px, env(safe-area-inset-top)) 24px 12px;
    display: flex; justify-content: space-between; align-items: center; z-index: 10;
  }
  .nav-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .nav-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff;
    padding: 8px 18px; border-radius: 24px; cursor: pointer; font-weight: 700; font-size: 12px;
    letter-spacing: 1px; backdrop-filter: blur(6px); transition: 0.25s; white-space: nowrap;
  }
  .nav-btn.active, .nav-btn:hover { background: #fff; color: #000; }
  .logo { font-size: 22px; font-weight: 900; font-style: italic; line-height: 0.9; text-align: center; letter-spacing: 2px; }
  .logo span { font-size: 10px; display: block; letter-spacing: 5px; color: #3b82f6; margin-top: 2px; }

  /* Controles inferiores del carrusel */
  #carousel-ui {
    position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    z-index: 10; text-align: center; transition: 0.35s; width: 92%; max-width: 420px;
  }
  .flavor-banner {
    background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
    padding: 12px 28px; transform: skewX(-10deg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 0 auto 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2); transition: transform 0.2s, background 0.4s;
    display: inline-block; max-width: 95%;
  }
  .flavor-banner:hover { transform: skewX(-10deg) scale(1.05); }
  .flavor-banner h2 { transform: skewX(10deg); font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
  .carousel-arrows { display: flex; gap: 14px; justify-content: center; align-items: center; }
  .carousel-hint { font-size: 11px; opacity: 0.85; letter-spacing: 1px; }
  .arrow-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.55); color: #fff; font-size: 16px; cursor: pointer; transition: 0.2s;
  }
  .arrow-btn:hover { background: #fff; color: #000; }

  /* Panel izquierdo de información (Modo Detalle 360) */
  #detail-panel {
    position: fixed; left: 5%; top: 50%; transform: translateY(-50%);
    width: 300px; z-index: 10; opacity: 0; pointer-events: none; transition: 0.4s;
  }
  #detail-panel.visible { opacity: 1; pointer-events: auto; }
  #detail-tag { font-size: 11px; letter-spacing: 2px; opacity: 0.75; text-transform: uppercase; }
  #detail-title { font-size: 28px; font-weight: 900; font-style: italic; margin: 4px 0 10px; line-height: 1; text-transform: uppercase; }
  .callout-line {
    height: 2px; width: 100%; background: linear-gradient(90deg, #fff, rgba(255,255,255,0.1));
    margin: 10px 0; position: relative;
  }
  .callout-line::after {
    content: ''; position: absolute; right: 0; top: -4px;
    width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff;
  }
  #detail-desc { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.88); margin-bottom: 14px; }
  .size-selector { display: flex; gap: 8px; margin-bottom: 14px; }
  .size-pill {
    padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.4); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .size-pill.active { background: #fff; color: #000; }

  /* Botones derechos de inspección */
  #side-controls {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 10;
    opacity: 0; pointer-events: none; transition: 0.4s;
  }
  #side-controls.visible { opacity: 1; pointer-events: auto; }
  .step-btn {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.55); color: #fff; cursor: pointer; font-weight: 800; font-size: 10px;
    transition: 0.25s; backdrop-filter: blur(6px);
  }
  .step-btn.active, .step-btn:hover { background: #fff; color: #000; transform: scale(1.08); }

  /* Ajustes responsivos para celulares */
  @media (max-width: 768px) {
    header {
      flex-direction: column; gap: 10px;
      padding: max(12px, env(safe-area-inset-top)) 12px 8px;
    }
    .logo { font-size: 19px; }
    .logo span { font-size: 8px; letter-spacing: 4px; }
    .nav-btn { padding: 6px 13px; font-size: 11px; }

    #carousel-ui {
      bottom: max(14px, env(safe-area-inset-bottom));
    }
    .flavor-banner { padding: 9px 22px; margin-bottom: 10px; }
    .flavor-banner h2 { font-size: 15px; }
    .carousel-hint { font-size: 10px; max-width: 170px; line-height: 1.2; }
    .arrow-btn { width: 36px; height: 36px; font-size: 14px; }

    #detail-panel {
      left: 50%; top: auto; bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%); width: 92%; max-width: 380px;
      background: rgba(10, 10, 14, 0.82); backdrop-filter: blur(10px);
      padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15);
    }
    #detail-title { font-size: 20px; margin: 2px 0 6px; }
    .callout-line { margin: 6px 0; }
    #detail-desc { font-size: 12px; margin-bottom: 10px; line-height: 1.4; }
    .size-selector { margin-bottom: 10px; }

    #side-controls {
      right: 12px; top: 40%; transform: translateY(-50%); gap: 8px;
    }
    .step-btn { width: 40px; height: 40px; font-size: 9px; }
    #bg-giant-text { font-size: 20vw; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">TILL FAILURE<span id="brand-sub">ATHLETIC GEAR</span></div>
    <div class="nav-group">
      <button class="nav-btn active" onclick="setMode('carousel')">1. CARRUSEL</button>
      <button class="nav-btn" onclick="setMode('detail')">2. 360° DETALLE</button>
      <button class="nav-btn" onclick="setMode('lineup')">3. COLECCIÓN</button>
    </div>
  </header>

  <div id="bg-giant-text">TILL<br>FAILURE</div>
  <div id="canvas-container"></div>

  <div id="carousel-ui">
    <div class="flavor-banner" id="flavor-banner" onclick="setMode('detail')">
      <h2 id="flavor-name">ROYAL BLUE EDITION</h2>
    </div>
    <div class="carousel-arrows">
      <button class="arrow-btn" onclick="changeShirt(-1)">&#8592;</button>
      <span class="carousel-hint">TOCA LA PLAYERA PARA INSPECCIONAR</span>
      <button class="arrow-btn" onclick="changeShirt(1)">&#8594;</button>
    </div>
  </div>

  <div id="detail-panel">
    <div id="detail-tag">VISTA FRONTAL</div>
    <h1 id="detail-title">ROYAL BLUE EDITION</h1>
    <div class="callout-line"></div>
    <p id="detail-desc">Playera de alto rendimiento con corte atlético ergonómico, tejido microperforado transpirable y estampado frontal de alta densidad "TILL FAILURE".</p>
    <div class="size-selector">
      <button class="size-pill" onclick="selectSize(this)">S</button>
      <button class="size-pill active" onclick="selectSize(this)">M</button>
      <button class="size-pill" onclick="selectSize(this)">L</button>
      <button class="size-pill" onclick="selectSize(this)">XL</button>
    </div>
    <button class="nav-btn" onclick="setMode('carousel')">&#8592; VOLVER AL CARRUSEL</button>
  </div>

  <div id="side-controls">
    <button class="step-btn active" title="Frente" onclick="inspectStep(0)">FRENTE</button>
    <button class="step-btn" title="Tejido Dry-Fit" onclick="inspectStep(1)">TELA</button>
    <button class="step-btn" title="Corte y Costuras" onclick="inspectStep(2)">FIT</button>
    <button class="step-btn" title="Especificaciones" onclick="inspectStep(3)">INFO</button>
  </div>

<script>
const SHIRTS = [
  {
    name: "ROYAL BLUE EDITION",
    fabricColor: "#1434a4",
    fabricDark: "#0a1952",
    textColor: "#f2f4f8",
    bgRadial: "#1e3a8a",
    accent: "#60a5fa",
    roughness: 0.65
  },
  {
    name: "PURE WHITE EDITION",
    fabricColor: "#f3f4f6",
    fabricDark: "#c7cbd1",
    textColor: "#18181b",
    bgRadial: "#52525b",
    accent: "#e4e4e7",
    roughness: 0.7
  },
  {
    name: "STEALTH BLACK EDITION",
    fabricColor: "#232326",
    fabricDark: "#0c0c0e",
    textColor: "#f4f4f6",
    bgRadial: "#27272a",
    accent: "#a1a1aa",
    roughness: 0.62
  },
  {
    name: "CRIMSON RED EDITION",
    fabricColor: "#b80f1a",
    fabricDark: "#54050a",
    textColor: "#f5f5f7",
    bgRadial: "#7f1d1d",
    accent: "#f87171",
    roughness: 0.65
  }
];

let currentIndex = 0;
let currentMode = 'carousel';

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);

function isMobileView() {
  return window.innerWidth <= 768;
}

function adjustCameraForScreen() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.set(0, 0.25, isMobileView() ? 11.4 : 10.2);
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.25);
keyLight.position.set(4, 7, 6);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.6);
fillLight.position.set(-5, 3, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x3b82f6, 2.2, 22);
rimLight.position.set(0, 2, -4);
scene.add(rimLight);

const pedestalGroup = new THREE.Group();
const baseMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1.3, 1.45, 0.14, 48),
  new THREE.MeshStandardMaterial({ color: 0x141418, metalness: 0.8, roughness: 0.25 })
);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(1.33, 0.025, 16, 64), ringMat);
ringMesh.rotation.x = Math.PI / 2;
ringMesh.position.y = 0.07;
pedestalGroup.add(baseMesh, ringMesh);
pedestalGroup.position.set(0, -2.15, 3.1);
scene.add(pedestalGroup);

function createTorsoTexture(shirt, highlight = 0) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0, shirt.fabricColor);
  g.addColorStop(0.55, shirt.fabricColor);
  g.addColorStop(1, shirt.fabricDark);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < 1024; y += 6) {
    for (let x = 0; x < 1024; x += 6) {
      if ((x + y) % 12 === 0) ctx.fillRect(x, y, 2, 2);
    }
  }

  const foldGrad = ctx.createRadialGradient(256, 430, 30, 256, 480, 280);
  foldGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
  foldGrad.addColorStop(0.6, 'rgba(0,0,0,0.0)');
  foldGrad.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = foldGrad;
  ctx.fillRect(0, 0, 512, 1024);

  ctx.save();
  ctx.fillStyle = shirt.textColor;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.28)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;

  ctx.font = '900 84px "Arial Black", Impact, sans-serif';
  ctx.fillText('TILL', 256, 365);
  ctx.font = '900 78px "Arial Black", Impact, sans-serif';
  ctx.fillText('FAILURE', 256, 455);
  ctx.restore();

  ctx.fillStyle = shirt.textColor;
  ctx.font = '900 22px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TF // PERFORMANCE', 768, 150);

  const specs = [
    { y: 210, title: "TEJIDO DRY-MESH", sub: "MICROFIBRA TRANSPIRABLE" },
    { y: 420, title: "CORTE ATLÉTICO", sub: "AJUSTE MUSCULAR ERGONÓMICO" },
    { y: 630, title: "ALTA RESISTENCIA", sub: "ESTAMPADO ANTI-DESGASTE" }
  ];

  ctx.textAlign = 'left';
  specs.forEach((sp, idx) => {
    const active = highlight === idx + 1;
    ctx.fillStyle = active ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.38)';
    ctx.fillRect(600, sp.y, 336, 165);
    ctx.strokeStyle = active ? shirt.textColor : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = active ? 6 : 2;
    ctx.strokeRect(600, sp.y, 336, 165);

    ctx.fillStyle = shirt.textColor;
    ctx.font = 'bold 25px Segoe UI, sans-serif';
    ctx.fillText(sp.title, 622, sp.y + 68);
    ctx.font = '600 18px Segoe UI, sans-serif';
    ctx.globalAlpha = 0.85;
    ctx.fillText(sp.sub, 622, sp.y + 115);
    ctx.globalAlpha = 1.0;
  });

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

function createSleeveTexture(shirt) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = shirt.fabricColor;
  ctx.fillRect(0, 0, 512, 512);

  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(120 + i * 22, 430, 12, 28);
  }
  return new THREE.CanvasTexture(c);
}

function createTShirtMesh(shirt) {
  const group = new THREE.Group();

  const torsoGeo = new THREE.CylinderGeometry(0.95, 0.82, 2.55, 64, 32, false);
  const pos = torsoGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = pos.getZ(i);

    z *= 0.52;

    const heightFactor = (y + 1.275) / 2.55;
    let widthScale = 1.0;
    if (heightFactor > 0.65) {
      widthScale = 1.0 + (heightFactor - 0.65) * 0.55;
    } else if (heightFactor > 0.2 && heightFactor <= 0.65) {
      widthScale = 0.92 + Math.abs(heightFactor - 0.42) * 0.35;
    }
    x *= widthScale;

    if (z > 0 && heightFactor > 0.55 && heightFactor < 0.88) {
      z += Math.sin((heightFactor - 0.55) / 0.33 * Math.PI) * 0.12;
    }

    z += Math.sin(y * 7 + x * 4) * 0.014;
    pos.setXYZ(i, x, y, z);
  }
  torsoGeo.computeVertexNormals();
  torsoGeo.rotateY(-Math.PI / 2);

  const torsoMat = new THREE.MeshStandardMaterial({
    map: createTorsoTexture(shirt, 0),
    roughness: shirt.roughness,
    metalness: 0.08
  });
  const torsoMesh = new THREE.Mesh(torsoGeo, torsoMat);
  group.add(torsoMesh);

  const sleeveMat = new THREE.MeshStandardMaterial({
    map: createSleeveTexture(shirt),
    roughness: shirt.roughness,
    metalness: 0.08
  });

  const sleeveGeo = new THREE.CylinderGeometry(0.36, 0.31, 0.95, 32, 8, false);
  sleeveGeo.scale(1, 1, 0.78);

  const leftSleeve = new THREE.Mesh(sleeveGeo, sleeveMat);
  leftSleeve.position.set(-1.12, 0.74, 0);
  leftSleeve.rotation.z = -0.62;
  group.add(leftSleeve);

  const rightSleeve = new THREE.Mesh(sleeveGeo, sleeveMat);
  rightSleeve.position.set(1.12, 0.74, 0);
  rightSleeve.rotation.z = 0.62;
  group.add(rightSleeve);

  const collarMat = new THREE.MeshStandardMaterial({
    color: shirt.fabricColor,
    roughness: 0.75,
    metalness: 0.05
  });
  const collarGeo = new THREE.TorusGeometry(0.46, 0.065, 16, 48);
  collarGeo.scale(1.15, 0.72, 1);
  const collarMesh = new THREE.Mesh(collarGeo, collarMat);
  collarMesh.rotation.x = Math.PI / 2 + 0.18;
  collarMesh.position.set(0, 1.26, 0.05);
  group.add(collarMesh);

  const neckHoleMesh = new THREE.Mesh(
    new THREE.CircleGeometry(0.45, 32),
    new THREE.MeshBasicMaterial({ color: 0x08080a })
  );
  neckHoleMesh.scale.set(1.12, 0.7, 1);
  neckHoleMesh.rotation.x = -Math.PI / 2 + 0.18;
  neckHoleMesh.position.set(0, 1.27, 0.05);
  group.add(neckHoleMesh);

  group.userData = { torsoMesh, shirt };
  scene.add(group);
  return group;
}

const shirts = SHIRTS.map(s => createTShirtMesh(s));

function updatePositions(dur = 0.85) {
  const s = SHIRTS[currentIndex];
  const mobile = isMobileView();
  document.getElementById('flavor-name').textContent = s.name;
  document.getElementById('flavor-banner').style.background = `linear-gradient(135deg, ${s.fabricColor}, ${s.fabricDark})`;
  document.getElementById('flavor-banner').style.color = s.textColor;
  document.getElementById('brand-sub').style.color = s.accent;
  ringMat.color.set(s.accent);
  rimLight.color.set(s.accent);

  if (currentMode === 'carousel') {
    container.style.background = `radial-gradient(circle at 50% 45%, ${s.bgRadial} 0%, #070709 75%)`;
    gsap.to(pedestalGroup.scale, { x: 1, y: 1, z: 1, duration: 0.5 });

    const radius = mobile ? 2.8 : 3.1;
    const frontScale = mobile ? 0.94 : 1.05;
    const backScale = mobile ? 0.65 : 0.78;

    shirts.forEach((item, i) => {
      const off = (i - currentIndex + shirts.length) % shirts.length;
      const ang = (off / shirts.length) * Math.PI * 2;
      const front = off === 0;
      gsap.to(item.position, {
        x: Math.sin(ang) * radius,
        y: front ? (mobile ? 0.05 : -0.05) : 0.15,
        z: Math.cos(ang) * radius,
        duration: dur,
        ease: "power3.out"
      });
      gsap.to(item.rotation, {
        x: front ? 0.04 : 0.08,
        y: -ang,
        z: front ? 0 : Math.sin(ang) * 0.1,
        duration: dur,
        ease: "power3.out"
      });
      gsap.to(item.scale, {
        x: front ? frontScale : backScale,
        y: front ? frontScale : backScale,
        z: front ? frontScale : backScale,
        duration: dur
      });
    });
  } else if (currentMode === 'detail') {
    container.style.background = `radial-gradient(circle at 58% 50%, ${s.bgRadial} 0%, #070709 90%)`;
    gsap.to(pedestalGroup.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.4 });

    shirts.forEach((item, i) => {
      if (i === currentIndex) {
        gsap.to(item.position, {
          x: mobile ? -0.15 : 0.55,
          y: mobile ? 0.45 : 0,
          z: mobile ? 4.2 : 4.8,
          duration: dur,
          ease: "power3.out"
        });
        gsap.to(item.rotation, { x: 0.06, y: -0.18, z: 0, duration: dur, ease: "power3.out" });
        const sc = mobile ? 0.92 : 1.15;
        gsap.to(item.scale, { x: sc, y: sc, z: sc, duration: dur });
      } else {
        gsap.to(item.position, { x: (i - currentIndex) * 5.5, y: -6, z: -4, duration: 0.5 });
      }
    });
    inspectStep(0);
  } else {
    container.style.background = `radial-gradient(circle at 50% 50%, ${s.bgRadial} 0%, #060608 85%)`;
    gsap.to(pedestalGroup.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.4 });

    if (mobile) {
      // En celular mostramos cuadrícula 2x2 para que no se salgan de la pantalla
      const positions = [
        { x: -0.95, y: 0.85 },
        { x: 0.95, y: 0.85 },
        { x: -0.95, y: -0.85 },
        { x: 0.95, y: -0.85 }
      ];
      shirts.forEach((item, i) => {
        gsap.to(item.position, { x: positions[i].x, y: positions[i].y, z: 1.5, duration: dur, ease: "back.out(1.2)" });
        gsap.to(item.rotation, { x: 0.04, y: -0.15, z: 0, duration: dur });
        gsap.to(item.scale, { x: 0.58, y: 0.58, z: 0.58, duration: dur });
      });
    } else {
      const spacing = 2.25;
      const startX = -((shirts.length - 1) * spacing) / 2;
      shirts.forEach((item, i) => {
        gsap.to(item.position, { x: startX + i * spacing, y: 0, z: 2.3, duration: dur, ease: "back.out(1.2)" });
        gsap.to(item.rotation, { x: 0.04, y: -0.15, z: 0, duration: dur });
        gsap.to(item.scale, { x: 0.92, y: 0.92, z: 0.92, duration: dur });
      });
    }
  }
}

function changeShirt(dir) {
  currentIndex = (currentIndex + dir + shirts.length) % shirts.length;
  updatePositions();
}

function setMode(m) {
  currentMode = m;
  document.querySelectorAll('header .nav-btn').forEach((b, i) => {
    b.classList.toggle('active', (m==='carousel'&&i===0) || (m==='detail'&&i===1) || (m==='lineup'&&i===2));
  });
  document.getElementById('carousel-ui').style.opacity = m === 'carousel' ? '1' : '0';
  document.getElementById('carousel-ui').style.pointerEvents = m === 'carousel' ? 'auto' : 'none';
  document.getElementById('detail-panel').classList.toggle('visible', m === 'detail');
  document.getElementById('side-controls').classList.toggle('visible', m === 'detail');
  document.getElementById('bg-giant-text').style.opacity = m === 'lineup' ? '1' : '0';
  document.getElementById('bg-giant-text').style.transform = m === 'lineup' ? 'scale(1)' : 'scale(0.9)';
  updatePositions();
}

const STEPS = [
  {
    tag: "VISTA FRONTAL",
    title: "",
    desc: "Playera de entrenamiento con estampado pectoral 'TILL FAILURE' de alto contraste y detalles reflectantes en mangas.",
    ry: -0.18, rz: 0, y: 0
  },
  {
    tag: "TECNOLOGÍA TEXTIL",
    title: "TEJIDO DRY-MESH",
    desc: "Tejido técnico microperforado de secado rápido que evacúa el sudor y mantiene la temperatura corporal en series al fallo.",
    ry: Math.PI - 0.2, rz: 0, y: -0.25
  },
  {
    tag: "ERGONOMÍA",
    title: "CORTE ATLÉTICO",
    desc: "Diseño ajustado en pecho y hombros con caída libre en cintura para máxima movilidad sin limitar el rango de entrenamiento.",
    ry: Math.PI - 0.2, rz: 0, y: 0.05
  },
  {
    tag: "DURABILIDAD",
    title: "ALTA RESISTENCIA",
    desc: "Costuras reforzadas y serigrafía elástica que no se cuartea ni pierde intensidad tras lavados intensivos.",
    ry: Math.PI - 0.2, rz: 0, y: 0.35
  }
];

function inspectStep(s) {
  const item = shirts[currentIndex], shirtData = SHIRTS[currentIndex], info = STEPS[s];
  const mobile = isMobileView();
  document.querySelectorAll('.step-btn').forEach((b, i) => b.classList.toggle('active', i === s));
  document.getElementById('detail-tag').textContent = info.tag;
  document.getElementById('detail-title').textContent = s === 0 ? shirtData.name : info.title;
  document.getElementById('detail-desc').textContent = info.desc;

  item.userData.torsoMesh.material.map = createTorsoTexture(shirtData, s);
  item.userData.torsoMesh.material.needsUpdate = true;

  gsap.to(item.rotation, { y: info.ry, z: info.rz, duration: 0.85, ease: "power3.inOut" });
  gsap.to(item.position, { y: (mobile ? 0.45 : 0) + info.y * 0.6, duration: 0.85, ease: "power3.inOut" });
}

function selectSize(btn) {
  document.querySelectorAll('.size-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  shirts.forEach((item, i) => {
    item.position.y += Math.sin(t * 2.0 + i) * 0.0012;
  });
  camera.lookAt(0, 0, 2);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  adjustCameraForScreen();
  updatePositions(0.4);
});

adjustCameraForScreen();
updatePositions(0);
animate();
</script>
</body>
</html>
