<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TILL FAILURE - Catálogo 3D Interactivo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Impact, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    overflow: hidden; background: #030305; color: #fff;
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }

  /* Contenedor principal con dimensiones garantizadas desde el inicio */
  #app-viewport {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; background: #070709;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 0.45s ease;
  }
  #app-viewport.mobile-frame {
    border-radius: 28px;
    border: 2px solid rgba(255,255,255,0.22);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.85), 0 20px 60px rgba(0,0,0,0.95);
  }

  #canvas-container {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
    transition: background 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    background: radial-gradient(circle at 50% 42%, #162038 0%, #060608 78%);
  }
  #bg-giant-text {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 0; font-size: 12vw; font-weight: 900; font-style: italic;
    line-height: 0.85; text-align: center; color: rgba(255,255,255,0.07); pointer-events: none;
    opacity: 0; transform: scale(0.9); transition: all 0.6s ease;
  }
  #app-viewport.compact-ui #bg-giant-text { font-size: 54px; }

  /* Indicador de carga */
  #loader-badge {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
    background: rgba(12, 14, 22, 0.88); border: 1px solid rgba(255,255,255,0.22);
    padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 700;
    letter-spacing: 1.2px; z-index: 60; backdrop-filter: blur(8px);
    transition: opacity 0.4s ease; white-space: nowrap; pointer-events: none;
  }
  #app-viewport.compact-ui #loader-badge { top: 88px; font-size: 8.5px; padding: 4px 10px; }

  /* Barra superior */
  header {
    position: absolute; top: 0; left: 0; width: 100%; padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 55; background: linear-gradient(180deg, rgba(5,5,8,0.8) 0%, rgba(5,5,8,0) 100%);
  }
  .header-controls { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .nav-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff;
    padding: 8px 14px; border-radius: 22px; cursor: pointer; font-weight: 700; font-size: 11px;
    letter-spacing: 0.6px; backdrop-filter: blur(8px); transition: all 0.2s ease; white-space: nowrap;
  }
  .nav-btn.active, .nav-btn:hover { background: #fff; color: #000; }
  .format-btn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: 1px solid rgba(255,255,255,0.45); color: #fff;
    padding: 8px 14px; border-radius: 22px; cursor: pointer; font-weight: 800; font-size: 11px;
    letter-spacing: 0.6px; box-shadow: 0 4px 14px rgba(37,99,235,0.45); transition: all 0.2s ease;
    white-space: nowrap;
  }
  .format-btn:hover { filter: brightness(1.12); }

  .logo { font-size: 20px; font-weight: 900; font-style: italic; line-height: 0.9; text-align: center; letter-spacing: 2px; }
  .logo span { font-size: 9px; display: block; letter-spacing: 3.5px; color: #3b82f6; margin-top: 3px; font-style: normal; }

  /* Cabecera compacta en Modo Celular / Vertical */
  #app-viewport.compact-ui header {
    flex-direction: column; gap: 5px; padding: 8px 8px 6px;
  }
  #app-viewport.compact-ui .logo { font-size: 15px; }
  #app-viewport.compact-ui .logo span { font-size: 7px; letter-spacing: 2.5px; margin-top: 1px; }
  #app-viewport.compact-ui .header-controls { gap: 4px; width: 100%; }
  #app-viewport.compact-ui .nav-btn { padding: 5px 8px; font-size: 8.8px; letter-spacing: 0.2px; }
  #app-viewport.compact-ui .format-btn { padding: 5px 9px; font-size: 8.8px; }

  /* Controles inferiores del carrusel */
  #carousel-ui {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    z-index: 55; text-align: center; transition: opacity 0.35s ease, transform 0.35s ease;
    width: max-content; max-width: 94%;
    background: rgba(8, 8, 12, 0.58); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 30px rgba(0,0,0,0.65);
  }
  .banner-row {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px;
  }
  .flavor-banner {
    background: linear-gradient(135deg, #102a7a, #08153d);
    padding: 8px 26px; transform: skewX(-10deg);
    box-shadow: 0 6px 18px rgba(0,0,0,0.6); cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25); transition: transform 0.2s ease, background 0.4s ease;
    min-width: 170px;
  }
  .flavor-banner:hover { transform: skewX(-10deg) scale(1.03); }
  .flavor-banner h2 {
    transform: skewX(10deg); font-size: 16px; letter-spacing: 2px;
    text-transform: uppercase; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.75);
  }
  .arrow-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.12); color: #fff; font-size: 17px; font-weight: 900;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .arrow-btn:hover, .arrow-btn:active { background: #fff; color: #000; transform: scale(1.08); }
  .inspect-hint {
    font-size: 9.5px; opacity: 0.85; letter-spacing: 0.8px; display: block;
  }

  #app-viewport.compact-ui #carousel-ui {
    bottom: 10px; padding: 7px 12px; border-radius: 16px;
  }
  #app-viewport.compact-ui .banner-row { gap: 8px; margin-bottom: 3px; }
  #app-viewport.compact-ui .flavor-banner { padding: 6px 14px; min-width: 130px; }
  #app-viewport.compact-ui .flavor-banner h2 { font-size: 13px; letter-spacing: 1.2px; }
  #app-viewport.compact-ui .arrow-btn { width: 32px; height: 32px; font-size: 14px; }
  #app-viewport.compact-ui .inspect-hint { font-size: 8px; letter-spacing: 0.5px; }

  /* Panel único de información e interacción (Izquierda en PC / Abajo en Celular) */
  #detail-panel {
    position: absolute; left: 2.5%; bottom: 20px;
    width: 295px; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    background: rgba(10, 12, 18, 0.55);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    padding: 16px 18px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 16px 40px rgba(0,0,0,0.65);
  }
  #detail-panel.visible { opacity: 1; pointer-events: auto; }
  #detail-tag { font-size: 9.5px; letter-spacing: 2px; color: #93c5fd; font-weight: 700; text-transform: uppercase; }
  #detail-title { font-size: 22px; font-weight: 900; font-style: italic; margin: 2px 0 6px; line-height: 1.05; text-transform: uppercase; }
  .callout-line {
    height: 2px; width: 100%; background: linear-gradient(90deg, #fff, rgba(255,255,255,0.1));
    margin: 6px 0 10px; position: relative;
  }
  .callout-line::after {
    content: ''; position: absolute; right: 0; top: -3px;
    width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff;
  }

  /* Lista de puntos estilizados (exclusiva para Tela y Lavado) */
  .feature-list {
    list-style: none; display: none; flex-direction: column; gap: 6px;
    margin-bottom: 12px; padding: 0;
  }
  .feature-list.show { display: flex; }
  .feature-list li {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
    padding: 7px 11px; border-radius: 10px; font-size: 12px; font-weight: 700;
    color: #f8fafc; letter-spacing: 0.4px;
  }
  .feature-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #60a5fa;
    box-shadow: 0 0 8px #60a5fa; flex-shrink: 0;
  }

  .selector-label { font-size: 9px; letter-spacing: 1.3px; text-transform: uppercase; opacity: 0.78; margin-bottom: 4px; font-weight: 700; }
  .gender-selector, .size-selector { display: flex; gap: 5px; margin-bottom: 8px; }
  .gender-pill, .size-pill {
    flex: 1; text-align: center; padding: 6px 6px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.28); background: rgba(0,0,0,0.45);
    color: #fff; font-size: 10.5px; font-weight: 800; cursor: pointer; transition: 0.2s;
  }
  .gender-pill.active, .size-pill.active { background: #fff; color: #000; border-color: #fff; }

  /* Botón interactivo de Manga Larga */
  .sleeve-btn-wrap { margin-bottom: 9px; }
  .sleeve-toggle-btn {
    width: 100%; padding: 8px 12px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.32);
    background: linear-gradient(135deg, rgba(37,99,235,0.28), rgba(15,23,42,0.65));
    color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-transform: uppercase;
  }
  .sleeve-toggle-btn:hover { border-color: #fff; transform: translateY(-1px); }
  .sleeve-toggle-btn.active {
    background: #ffffff; color: #000000; border-color: #ffffff;
    box-shadow: 0 0 16px rgba(255,255,255,0.45);
  }
  .sleeve-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.45); transition: 0.25s;
  }
  .sleeve-toggle-btn.active .sleeve-indicator {
    background: #1d4ed8; box-shadow: 0 0 6px #1d4ed8;
  }

  .detail-nav-row { display: flex; gap: 6px; margin-top: 4px; }
  .detail-nav-row .nav-btn { flex: 1; padding: 6px 6px; font-size: 9.5px; text-align: center; }

  /* En Modo Celular: Panel desenfocado compacto en la parte baja para lucir la playera */
  #app-viewport.compact-ui #detail-panel {
    left: 3%; right: 3%; width: 94%; top: auto; bottom: 8px;
    transform: none; padding: 10px 12px; border-radius: 15px;
    background: rgba(10, 12, 18, 0.52);
  }
  #app-viewport.compact-ui #detail-tag { font-size: 8px; letter-spacing: 1.5px; }
  #app-viewport.compact-ui #detail-title { font-size: 15px; margin: 1px 0 3px; }
  #app-viewport.compact-ui .callout-line { margin: 3px 0 6px; }
  #app-viewport.compact-ui .feature-list { gap: 4px; margin-bottom: 7px; }
  #app-viewport.compact-ui .feature-list li { padding: 4.5px 9px; font-size: 10px; border-radius: 7px; }
  #app-viewport.compact-ui .selector-label { font-size: 7.5px; margin-bottom: 2px; }
  #app-viewport.compact-ui .gender-selector,
  #app-viewport.compact-ui .size-selector { gap: 4px; margin-bottom: 5px; }
  #app-viewport.compact-ui .gender-pill,
  #app-viewport.compact-ui .size-pill { padding: 4px 4px; font-size: 9.2px; }
  #app-viewport.compact-ui .sleeve-btn-wrap { margin-bottom: 6px; }
  #app-viewport.compact-ui .sleeve-toggle-btn { padding: 5.5px 10px; font-size: 9.5px; border-radius: 7px; }
  #app-viewport.compact-ui .detail-nav-row { margin-top: 2px; }
  #app-viewport.compact-ui .detail-nav-row .nav-btn { padding: 4.5px 5px; font-size: 8.5px; }

  /* Botones derechos de inspección 360° */
  #side-controls {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 52;
    opacity: 0; pointer-events: none; transition: 0.35s;
  }
  #side-controls.visible { opacity: 1; pointer-events: auto; }
  .step-btn {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.62); color: #fff; cursor: pointer; font-weight: 800; font-size: 9px;
    letter-spacing: 0.4px; transition: all 0.2s ease; backdrop-filter: blur(8px);
  }
  .step-btn.active, .step-btn:hover { background: #fff; color: #000; transform: scale(1.1); box-shadow: 0 0 16px rgba(255,255,255,0.5); }

  #app-viewport.compact-ui #side-controls {
    right: 8px; top: 36%; gap: 6px;
  }
  #app-viewport.compact-ui .step-btn {
    width: 36px; height: 36px; font-size: 7.8px;
  }
</style>
</head>
<body>
  <div id="app-viewport">
    <div id="loader-badge">CARGANDO MODELO 3D PROFESIONAL...</div>

    <header>
      <div class="logo">TILL FAILURE<span id="brand-sub">ROPA DEPORTIVA</span></div>
      <div class="header-controls">
        <button class="nav-btn active" onclick="setMode('carousel')">1. CARRUSEL</button>
        <button class="nav-btn" onclick="setMode('detail')">2. VISTA 360°</button>
        <button class="nav-btn" onclick="setMode('lineup')">3. COLECCIÓN</button>
        <button class="format-btn" id="format-toggle-btn" onclick="toggleScreenFormat()">📱 MODO CELULAR 9:16</button>
      </div>
    </header>

    <div id="bg-giant-text">TILL<br>FAILURE</div>
    <div id="canvas-container"></div>

    <!-- Barra inferior integrada con flechas + nombre del producto -->
    <div id="carousel-ui">
      <div class="banner-row">
        <button class="arrow-btn" title="Producto Anterior" onclick="changeShirt(-1)">&#8592;</button>
        <div class="flavor-banner" id="flavor-banner" onclick="setMode('detail')">
          <h2 id="flavor-name">TILL AZUL</h2>
        </div>
        <button class="arrow-btn" title="Siguiente Producto" onclick="changeShirt(1)">&#8594;</button>
      </div>
      <span class="inspect-hint">TOCA LAS FLECHAS PARA CAMBIAR O LA PLAYERA PARA INSPECCIONAR</span>
    </div>

    <!-- Panel único de detalles e interacción (sin tarjeta secundaria a la derecha) -->
    <div id="detail-panel">
      <div id="detail-tag">DISEÑO ORIGINAL</div>
      <h1 id="detail-title">TILL AZUL</h1>
      <div class="callout-line" id="callout-line"></div>

      <!-- Lista estilizada de puntos (visible en Tela y Lavado) -->
      <ul class="feature-list" id="detail-list"></ul>

      <div class="selector-label">CORTE DE PRENDA</div>
      <div class="gender-selector">
        <button class="gender-pill active" onclick="selectGender('hombre', this)">HOMBRE</button>
        <button class="gender-pill" onclick="selectGender('mujer', this)">MUJER</button>
      </div>

      <div class="sleeve-btn-wrap">
        <button class="sleeve-toggle-btn" id="sleeve-toggle-btn" onclick="toggleLongSleeve()">
          <span class="sleeve-indicator"></span> MANGA LARGA
        </button>
      </div>

      <div class="selector-label">TALLAS DISPONIBLES</div>
      <div class="size-selector" id="size-selector">
        <button class="size-pill" data-size="XS" style="display:none;" onclick="selectSize(this)">XS</button>
        <button class="size-pill" data-size="S" onclick="selectSize(this)">S</button>
        <button class="size-pill active" data-size="M" onclick="selectSize(this)">M</button>
        <button class="size-pill" data-size="L" onclick="selectSize(this)">L</button>
        <button class="size-pill" data-size="XL" onclick="selectSize(this)">XL</button>
      </div>

      <div class="detail-nav-row">
        <button class="nav-btn" onclick="changeShirt(-1)">&#8592; ANTERIOR</button>
        <button class="nav-btn" onclick="setMode('carousel')">CARRUSEL</button>
        <button class="nav-btn" onclick="changeShirt(1)">SIGUIENTE &#8594;</button>
      </div>
    </div>

    <!-- Botones laterales de vista 360° -->
    <div id="side-controls">
      <button class="step-btn active" title="Vista Frontal" onclick="inspectStep(0)">FRENTE</button>
      <button class="step-btn" title="Frescura y Comodidad" onclick="inspectStep(1)">TELA</button>
      <button class="step-btn" title="Ajuste Hombre y Mujer" onclick="inspectStep(2)">CORTE</button>
      <button class="step-btn" title="Cuidado de la Prenda" onclick="inspectStep(3)">LAVADO</button>
    </div>
  </div>

<script>
const SHIRTS = [
  {
    name: "TILL AZUL",
    fabricColor: "#1438a8",
    bannerBg: "linear-gradient(135deg, #102a82, #091747)",
    textColor: "#f4f6fa",
    bgRadial: "#162a66",
    accent: "#60a5fa",
    roughness: 0.82
  },
  {
    name: "TILL BLANCA",
    fabricColor: "#eceef2",
    bannerBg: "linear-gradient(135deg, #27272a, #121215)",
    textColor: "#141417",
    bgRadial: "#3f3f46",
    accent: "#d4d4d8",
    roughness: 0.85
  },
  {
    name: "TILL NEGRA",
    fabricColor: "#1c1c20",
    bannerBg: "linear-gradient(135deg, #1f1f24, #09090b)",
    textColor: "#f4f4f6",
    bgRadial: "#27272a",
    accent: "#a1a1aa",
    roughness: 0.78
  },
  {
    name: "TILL ROJA",
    fabricColor: "#b8111c",
    bannerBg: "linear-gradient(135deg, #7f1018, #3b060a)",
    textColor: "#f5f5f7",
    bgRadial: "#631313",
    accent: "#f87171",
    roughness: 0.82
  }
];

let currentIndex = 0;
let currentMode = 'carousel';
let currentStep = 0;
let currentGender = 'hombre';
let isLongSleeve = false;

const viewport = document.getElementById('app-viewport');
const container = document.getElementById('canvas-container');

function getSafeWindowSize() {
  const vw = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 360);
  const vh = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 640);
  return { vw, vh };
}

let isMobileFormat = getSafeWindowSize().vw < getSafeWindowSize().vh;

// Estado de animación en tiempo real para transformar de manga corta a manga larga
const sleeveAnim = { progress: 0 };
let sharedBaseGeo = null;
let origPositions = null;
let modelBBox = null;
let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3();
const stripeDecalGroups = [];
const fallbackSleeveGroups = [];

function isCompactView() {
  const { vw, vh } = getSafeWindowSize();
  return isMobileFormat || (vw < vh);
}

function applyViewportDimensions() {
  const { vw, vh } = getSafeWindowSize();
  const nativePortrait = vw < vh;

  if (!isMobileFormat) {
    viewport.style.width = vw + 'px';
    viewport.style.height = vh + 'px';
    viewport.classList.remove('mobile-frame');
  } else {
    if (nativePortrait) {
      viewport.style.width = vw + 'px';
      viewport.style.height = vh + 'px';
      viewport.classList.remove('mobile-frame');
    } else {
      const availH = Math.max(vh - 12, 320);
      const availW = Math.max(vw - 12, 240);
      let targetW = availH * (9 / 16);
      let targetH = availH;
      if (targetW > availW) {
        targetW = availW;
        targetH = Math.min(availH, targetW * (16 / 9));
      }
      viewport.style.width = Math.floor(targetW) + 'px';
      viewport.style.height = Math.floor(targetH) + 'px';
      viewport.classList.add('mobile-frame');
    }
  }

  const compact = isCompactView();
  viewport.classList.toggle('compact-ui', compact);

  const btn = document.getElementById('format-toggle-btn');
  if (btn) {
    btn.textContent = isMobileFormat ? "💻 MODO HORIZONTAL" : "📱 MODO CELULAR 9:16";
  }
}

applyViewportDimensions();

const initW = Math.max(container.clientWidth || getSafeWindowSize().vw, 320);
const initH = Math.max(container.clientHeight || getSafeWindowSize().vh, 480);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, initW / initH, 0.1, 100);
camera.position.set(0, 0.15, 11.2);
const cameraTarget = new THREE.Vector3(0, 0.05, 1.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(initW, initH);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.58));

const keyLight = new THREE.DirectionalLight(0xffffff, 0.88);
keyLight.position.set(3.5, 5.5, 6);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcbd5e1, 0.42);
fillLight.position.set(-4.5, 2.5, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x3b82f6, 0.75, 16);
rimLight.position.set(0, 2.0, -3.5);
scene.add(rimLight);

const pedestalGroup = new THREE.Group();
const baseMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1.1, 1.25, 0.09, 48),
  new THREE.MeshStandardMaterial({ color: 0x0a0a0e, metalness: 0.4, roughness: 0.7 })
);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.45 });

function createFrontDecalTexture(shirt) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 680;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  ctx.save();
  ctx.fillStyle = shirt.textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = shirt.name === "TILL BLANCA" ? 'rgba(0,0,0,0.12)' : 'rgba(0,0,0,0.38)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 3;

  ctx.font = '900 220px "Arial Black", Impact, sans-serif';
  ctx.fillText('TILL', 512, 225);
  ctx.font = '900 195px "Arial Black", Impact, sans-serif';
  ctx.fillText('FAILURE', 512, 445);
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  return tex;
}

function createBackDecalTexture(shirt) {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  ctx.save();
  ctx.fillStyle = shirt.textColor;
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.85;
  ctx.font = '900 84px "Arial Black", Impact, sans-serif';
  ctx.fillText('TILL FAILURE', 512, 190);
  ctx.font = '700 44px Segoe UI, sans-serif';
  ctx.fillText('CÓMODA • FRESCA • SECADO RÁPIDO', 512, 285);
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  return tex;
}

function createSleeveStripeTexture(shirt) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  ctx.fillStyle = shirt.name === "TILL BLANCA" ? '#18181b' : '#ffffff';
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(110 + i * 52, 95, 28, 65);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

// Malla inicial de respaldo inmediato (garantiza que la escena jamás se vea vacía mientras descarga el GLB)
function createFallbackShirtMesh(shirt) {
  const group = new THREE.Group();
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = shirt.fabricColor;
  ctx.fillRect(0, 0, 1024, 1024);
  ctx.fillStyle = shirt.textColor;
  ctx.textAlign = 'center';
  ctx.font = '900 82px "Arial Black", Impact, sans-serif';
  ctx.fillText('TILL', 256, 360);
  ctx.font = '900 76px "Arial Black", Impact, sans-serif';
  ctx.fillText('FAILURE', 256, 445);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;

  const torsoGeo = new THREE.CylinderGeometry(0.88, 0.78, 2.35, 64, 32, false);
  const pos = torsoGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i) * 0.48;
    const h = (y + 1.175) / 2.35;
    const w = h > 0.88 ? 1.16 - (h - 0.88) * 2.2 : (h > 0.58 ? 0.95 + ((h - 0.58) / 0.30) * 0.21 : 0.94);
    pos.setXYZ(i, x * w, y, z);
  }
  torsoGeo.computeVertexNormals();
  torsoGeo.rotateY(-Math.PI / 2);

  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: shirt.roughness, metalness: 0.04 });
  group.add(new THREE.Mesh(torsoGeo, mat));

  const slMat = new THREE.MeshStandardMaterial({ color: shirt.fabricColor, roughness: shirt.roughness, metalness: 0.04 });
  [-1, 1].forEach(sign => {
    const slGeo = new THREE.CylinderGeometry(0.34, 0.28, 0.85, 32, 8, false);
    slGeo.translate(0, -0.35, 0);
    const sl = new THREE.Mesh(slGeo, slMat);
    sl.position.set(sign * 0.85, 0.92, 0);
    sl.rotation.z = sign * 0.48;
    group.add(sl);
    fallbackSleeveGroups.push(sl);
  });

  return group;
}

const shirts = SHIRTS.map((shirtData, idx) => {
  const rootGroup = new THREE.Group();
  rootGroup.userData = { shirtIndex: idx };
  rootGroup.add(createFallbackShirtMesh(shirtData));
  scene.add(rootGroup);
  return rootGroup;
});

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// Deformación geométrica polar corregida: 0% distorsión en torso/cintura y puño de muñeca plano y estilizado
function updateSleeveGeometryMorph() {
  const p = sleeveAnim.progress;

  // Respaldo por si aún no termina de descargar el GLB
  if (!sharedBaseGeo || !origPositions) {
    fallbackSleeveGroups.forEach(sl => {
      sl.scale.set(1 - 0.18 * p, 1 + 1.15 * p, 1 - 0.18 * p);
    });
    return;
  }

  const posAttr = sharedBaseGeo.attributes.position;
  const arr = posAttr.array;
  const count = posAttr.count;

  const cx = modelCenter.x;
  const cy = modelCenter.y;
  const cz = modelCenter.z;
  const sx = modelSize.x;
  const sy = modelSize.y;

  for (let i = 0; i < count; i++) {
    const idx = i * 3;
    const ox = origPositions[idx];
    const oy = origPositions[idx + 1];
    const oz = origPositions[idx + 2];

    if (p <= 0.0001) {
      arr[idx] = ox;
      arr[idx + 1] = oy;
      arr[idx + 2] = oz;
      continue;
    }

    const dx = ox - cx;
    const dy = oy - cy;
    const dz = oz - cz;
    const sign = dx >= 0 ? 1 : -1;
    const ax = Math.abs(dx) / sx;
    const ay = dy / sy;

    // 1. Corte vertical estricto: cualquier vértice debajo de la axila (ay <= 0.044) es 100% torso/cintura
    const vMask = smoothstep(0.044, 0.052, ay);
    if (vMask <= 0) {
      arr[idx] = ox;
      arr[idx + 1] = oy;
      arr[idx + 2] = oz;
      continue;
    }

    // 2. Costura de la sisa (separa el pecho/espalda del inicio de la manga)
    const nxSeam = 0.280 + 0.170 * Math.max(0.0, ay - 0.050);
    const dSeam = ax - nxSeam;
    const hMask = smoothstep(0.000, 0.008, dSeam);
    const sleeveMask = vMask * hMask;

    if (sleeveMask <= 0) {
      arr[idx] = ox;
      arr[idx + 1] = oy;
      arr[idx + 2] = oz;
      continue;
    }

    // 3. Progresión uniforme s en [0, 1] desde la sisa (s = 0) hasta todo el anillo del puño (s = 1)
    const nyCuff = 0.055 + 0.270 * (ax - 0.292);
    const dCuff = Math.max(0.0, ay - (nyCuff + 0.006));
    const spanY = 0.038 + 1.15 * Math.max(0.0, ax - 0.290);
    const sRaw = Math.max(0.0, Math.min(1.0, 1.0 - (dCuff / spanY)));
    const s = sRaw * sleeveMask;

    const sExt = smoothstep(0.04, 1.0, s);
    const sTaper = smoothstep(0.14, 1.0, s);

    // 4. Estrechamiento cilíndrico y nivelación horizontal del puño en la muñeca
    const axTapered = ax - (ax - 0.396) * (0.50 * sTaper * p);
    const ayTapered = ay - (ay - 0.083) * (0.78 * sTaper * p);

    // 5. Extensión anatómica con ligera curvatura de codo hasta la muñeca
    const elbowCurveX = 0.014 * Math.sin(sExt * Math.PI) * p;
    const dxArm = (0.048 * sExt + elbowCurveX) * p;
    const dyArm = (-0.385 * Math.pow(sExt, 1.06)) * p;
    const taperZ = 0.34 * sTaper * p;

    arr[idx] = cx + sign * (axTapered + dxArm) * sx;
    arr[idx + 1] = cy + (ayTapered + dyArm) * sy;
    arr[idx + 2] = cz + dz * (1.0 - taperZ);
  }

  posAttr.needsUpdate = true;
  sharedBaseGeo.computeVertexNormals();

  // Desplazar los detalles reflectantes de las mangas junto con el puño
  stripeDecalGroups.forEach(entry => {
    entry.mesh.position.x = entry.sign * sx * 0.048 * p;
    entry.mesh.position.y = -sy * 0.38 * p;
  });
}

function buildProfessionalShirtInstance(baseGeometry, origMaterial, shirt, targetGroup) {
  while (targetGroup.children.length > 0) {
    targetGroup.remove(targetGroup.children[0]);
  }

  const modelWrapper = new THREE.Group();

  const fabricMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(shirt.fabricColor),
    roughness: shirt.roughness,
    metalness: 0.04,
    aoMap: origMaterial && origMaterial.aoMap ? origMaterial.aoMap : null,
    aoMapIntensity: 0.32,
    normalMap: origMaterial && origMaterial.normalMap ? origMaterial.normalMap : null
  });

  const shirtMesh = new THREE.Mesh(baseGeometry, fabricMat);
  shirtMesh.updateMatrixWorld(true);
  modelWrapper.add(shirtMesh);

  const bbox = modelBBox;
  const center = modelCenter;
  const size = modelSize;

  if (typeof THREE.DecalGeometry !== 'undefined') {
    const frontPos = new THREE.Vector3(center.x, center.y + size.y * 0.08, bbox.max.z);
    const frontRot = new THREE.Euler(0, 0, 0);
    const frontSize = new THREE.Vector3(size.x * 0.40, size.y * 0.25, size.z * 0.55);
    const frontDecalGeo = new THREE.DecalGeometry(shirtMesh, frontPos, frontRot, frontSize);
    const frontDecalMat = new THREE.MeshStandardMaterial({
      map: createFrontDecalTexture(shirt),
      transparent: true,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -4,
      roughness: 0.65,
      metalness: 0.02
    });
    modelWrapper.add(new THREE.Mesh(frontDecalGeo, frontDecalMat));

    const backPos = new THREE.Vector3(center.x, center.y + size.y * 0.25, bbox.min.z);
    const backRot = new THREE.Euler(0, Math.PI, 0);
    const backSize = new THREE.Vector3(size.x * 0.34, size.y * 0.15, size.z * 0.55);
    const backDecalGeo = new THREE.DecalGeometry(shirtMesh, backPos, backRot, backSize);
    const backDecalMat = new THREE.MeshStandardMaterial({
      map: createBackDecalTexture(shirt),
      transparent: true,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -4,
      roughness: 0.65
    });
    modelWrapper.add(new THREE.Mesh(backDecalGeo, backDecalMat));

    const stripeTex = createSleeveStripeTexture(shirt);
    const stripeMat = new THREE.MeshStandardMaterial({
      map: stripeTex,
      transparent: true,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -4
    });
    [-1, 1].forEach(sign => {
      const slPos = new THREE.Vector3(center.x + sign * (size.x * 0.41), center.y + size.y * 0.04, bbox.max.z * 0.5);
      const slRot = new THREE.Euler(0, 0, sign * -0.45);
      const slSize = new THREE.Vector3(size.x * 0.12, size.y * 0.06, size.z * 0.9);
      const slDecalGeo = new THREE.DecalGeometry(shirtMesh, slPos, slRot, slSize);
      const slMesh = new THREE.Mesh(slDecalGeo, stripeMat);
      modelWrapper.add(slMesh);
      stripeDecalGroups.push({ mesh: slMesh, sign });
    });
  }

  const targetHeight = 2.45;
  const normScale = targetHeight / size.y;
  modelWrapper.scale.set(normScale, normScale, normScale);
  modelWrapper.position.set(-center.x * normScale, -center.y * normScale, -center.z * normScale);

  targetGroup.add(modelWrapper);
}

const GLB_URLS = [
  "https://cdn.jsdelivr.net/gh/adrianhajdin/project_threejs_ai@main/client/public/shirt_baked.glb",
  "https://raw.githubusercontent.com/adrianhajdin/project_threejs_ai/main/client/public/shirt_baked.glb",
  "https://cdn.jsdelivr.net/gh/Starklord17/threejs-t-shirt@main/client/public/shirt_baked.glb"
];

function loadGitHubShirtModel(urlIndex = 0) {
  if (typeof THREE.GLTFLoader === 'undefined' || urlIndex >= GLB_URLS.length) {
    document.getElementById('loader-badge').style.opacity = '0';
    return;
  }
  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load(
    GLB_URLS[urlIndex],
    (gltf) => {
      let foundMesh = null;
      gltf.scene.traverse((child) => {
        if (child.isMesh && !foundMesh) foundMesh = child;
      });
      if (foundMesh) {
        sharedBaseGeo = foundMesh.geometry.clone();
        sharedBaseGeo.computeBoundingBox();
        modelBBox = sharedBaseGeo.boundingBox.clone();
        modelBBox.getCenter(modelCenter);
        modelBBox.getSize(modelSize);
        origPositions = new Float32Array(sharedBaseGeo.attributes.position.array);

        stripeDecalGroups.length = 0;
        const origMat = foundMesh.material;
        SHIRTS.forEach((shirtData, idx) => {
          buildProfessionalShirtInstance(sharedBaseGeo, origMat, shirtData, shirts[idx]);
        });
        if (sleeveAnim.progress > 0.001) {
          updateSleeveGeometryMorph();
        }
        const badge = document.getElementById('loader-badge');
        badge.textContent = "MODELO 3D PROFESIONAL LISTO";
        setTimeout(() => { badge.style.opacity = '0'; }, 800);
        updatePositions(0.5);
      } else {
        loadGitHubShirtModel(urlIndex + 1);
      }
    },
    undefined,
    () => loadGitHubShirtModel(urlIndex + 1)
  );
}

loadGitHubShirtModel(0);

function getBaseScale(isFront) {
  const useCompact = isCompactView();

  if (currentMode === 'detail') {
    return useCompact ? 0.68 : 0.94;
  } else if (currentMode === 'lineup') {
    return useCompact ? 0.56 : 0.82;
  } else {
    return isFront ? (useCompact ? 0.68 : 0.86) : (useCompact ? 0.44 : 0.64);
  }
}

function applyGenderFit(dur = 0.5) {
  const isFemale = currentGender === 'mujer';
  shirts.forEach((item, i) => {
    const isFront = (i === currentIndex);
    const baseScale = getBaseScale(isFront);
    const sx = baseScale * (isFemale ? 0.90 : 1.0);
    const sy = baseScale * (isFemale ? 0.95 : 1.0);
    const sz = baseScale * (isFemale ? 0.94 : 1.0);
    gsap.to(item.scale, { x: sx, y: sy, z: sz, duration: dur, ease: "power3.out", overwrite: "auto" });
  });
}

function updatePositions(dur = 0.8) {
  const s = SHIRTS[currentIndex];
  document.getElementById('flavor-name').textContent = s.name;
  document.getElementById('flavor-banner').style.background = s.bannerBg;
  document.getElementById('brand-sub').style.color = s.accent;
  ringMat.color.set(s.accent);
  rimLight.color.set(s.accent);

  const isFemale = currentGender === 'mujer';
  const fitX = isFemale ? 0.90 : 1.0;
  const fitY = isFemale ? 0.95 : 1.0;
  const useCompact = isCompactView();

  camera.fov = useCompact ? 45 : 36;
  camera.updateProjectionMatrix();

  if (currentMode === 'carousel') {
    container.style.background = `radial-gradient(circle at 50% 42%, ${s.bgRadial} 0%, #060608 78%)`;
    const pedScale = useCompact ? 0.62 : 0.88;
    gsap.to(pedestalGroup.scale, { x: pedScale, y: pedScale, z: pedScale, duration: 0.5, overwrite: "auto" });
    gsap.to(pedestalGroup.position, {
      x: 0,
      y: useCompact ? -0.95 : -1.28,
      z: useCompact ? 2.0 : 2.6,
      duration: 0.5,
      overwrite: "auto"
    });
    gsap.to(camera.position, {
      x: 0,
      y: 0.15,
      z: useCompact ? 13.5 : 11.2,
      duration: dur,
      ease: "power3.out",
      overwrite: "auto"
    });

    const radiusX = useCompact ? 1.38 : 2.75;
    const radiusZ = useCompact ? 2.0 : 2.6;

    shirts.forEach((item, i) => {
      const off = (i - currentIndex + shirts.length) % shirts.length;
      const ang = (off / shirts.length) * Math.PI * 2;
      const front = off === 0;
      const sc = getBaseScale(front);

      gsap.to(item.position, {
        x: Math.sin(ang) * radiusX,
        y: front ? (useCompact ? 0.18 : 0.14) : (useCompact ? 0.32 : 0.28),
        z: Math.cos(ang) * radiusZ,
        duration: dur,
        ease: "power3.out",
        overwrite: "auto"
      });
      gsap.to(item.rotation, {
        x: front ? 0.02 : 0.05,
        y: -ang * 0.65,
        z: 0,
        duration: dur,
        ease: "power3.out",
        overwrite: "auto"
      });
      gsap.to(item.scale, {
        x: sc * fitX,
        y: sc * fitY,
        z: sc,
        duration: dur,
        ease: "power3.out",
        overwrite: "auto"
      });
    });
  } else if (currentMode === 'detail') {
    container.style.background = `radial-gradient(circle at 50% 40%, ${s.bgRadial} 0%, #050507 88%)`;
    gsap.to(pedestalGroup.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.35, overwrite: "auto" });

    shirts.forEach((item, i) => {
      if (i === currentIndex) {
        const targetX = useCompact ? -0.08 : 0.18;
        const targetY = useCompact ? 0.85 : 0.18;
        const targetZ = useCompact ? 3.8 : 4.35;
        const sc = getBaseScale(true);
        gsap.to(item.position, { x: targetX, y: targetY, z: targetZ, duration: dur, ease: "power3.out", overwrite: "auto" });
        gsap.to(item.scale, { x: sc * fitX, y: sc * fitY, z: sc, duration: dur, ease: "power3.out", overwrite: "auto" });
      } else {
        gsap.to(item.position, { x: (i - currentIndex) * 6.0, y: -8.0, z: -4, duration: 0.5, overwrite: "auto" });
      }
    });
    inspectStep(currentStep);
  } else if (currentMode === 'lineup') {
    container.style.background = `radial-gradient(circle at 50% 48%, ${s.bgRadial} 0%, #050507 85%)`;
    gsap.to(pedestalGroup.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.35, overwrite: "auto" });
    gsap.to(camera.position, { x: 0, y: 0.15, z: useCompact ? 13.2 : 11.2, duration: dur, ease: "power3.out", overwrite: "auto" });

    const sc = getBaseScale(false);
    if (useCompact) {
      const coords = [
        { x: -0.76, y: 0.78, z: 1.8 },
        { x: 0.76, y: 0.78, z: 1.8 },
        { x: -0.76, y: -0.75, z: 1.8 },
        { x: 0.76, y: -0.75, z: 1.8 }
      ];
      shirts.forEach((item, i) => {
        gsap.to(item.position, { x: coords[i].x, y: coords[i].y, z: coords[i].z, duration: dur, ease: "back.out(1.15)", overwrite: "auto" });
        gsap.to(item.rotation, { x: 0.02, y: -0.12, z: 0, duration: dur, ease: "power3.out", overwrite: "auto" });
        gsap.to(item.scale, { x: sc * fitX, y: sc * fitY, z: sc, duration: dur, overwrite: "auto" });
      });
    } else {
      const spacing = 2.05;
      const startX = -((shirts.length - 1) * spacing) / 2;
      shirts.forEach((item, i) => {
        gsap.to(item.position, { x: startX + i * spacing, y: 0.12, z: 2.0, duration: dur, ease: "back.out(1.15)", overwrite: "auto" });
        gsap.to(item.rotation, { x: 0.02, y: -0.14, z: 0, duration: dur, ease: "power3.out", overwrite: "auto" });
        gsap.to(item.scale, { x: sc * fitX, y: sc * fitY, z: sc, duration: dur, overwrite: "auto" });
      });
    }
  }
}

    info.bullets.forEach(text => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="feature-dot" style="background:${shirtData.accent}; box-shadow:0 0 8px ${shirtData.accent};"></span><span>${text}</span>`;
      listEl.appendChild(li);
    });
    listEl.classList.add('show');
  } else {
    listEl.classList.remove('show');
  }

  const panelElements = [
    document.getElementById('detail-tag'),
    document.getElementById('detail-title'),
    listEl
  ];
  gsap.fromTo(panelElements, { opacity: 0.25, x: -8 }, { opacity: 1, x: 0, duration: 0.32, stagger: 0.04, overwrite: "auto" });

  document.getElementById('detail-tag').textContent = info.tag;
  document.getElementById('detail-title').textContent = s === 0 ? shirtData.name : info.title;

  const baseY = useCompact ? 0.85 + info.y * 0.25 : 0.18 + info.y;
  const targetCamZ = useCompact ? info.camZ + 2.3 : info.camZ;

  gsap.to(item.rotation, { y: info.ry, z: info.rz, duration: 0.8, ease: "expo.out", overwrite: "auto" });
  gsap.to(item.position, { y: baseY, duration: 0.8, ease: "expo.out", overwrite: "auto" });
  gsap.to(camera.position, { z: targetCamZ, duration: 0.8, ease: "expo.out", overwrite: "auto" });
}

function selectSize(btn) {
  document.querySelectorAll('#size-selector .size-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// Filtro dinámico de tallas según Hombre (S, M, L, XL) o Mujer (XS, S, M, L)
function updateAvailableSizesByGender(gender) {
  const allowed = gender === 'hombre' ? ['S', 'M', 'L', 'XL'] : ['XS', 'S', 'M', 'L'];
  const pills = document.querySelectorAll('#size-selector .size-pill');
  let activeStillVisible = false;

  pills.forEach(btn => {
    const size = btn.getAttribute('data-size');
    if (allowed.includes(size)) {
      btn.style.display = '';
      if (btn.classList.contains('active')) activeStillVisible = true;
    } else {
      btn.style.display = 'none';
      btn.classList.remove('active');
    }
  });

  if (!activeStillVisible) {
    const defaultBtn = document.querySelector('#size-selector .size-pill[data-size="M"]');
    if (defaultBtn) defaultBtn.classList.add('active');
  }
}

function selectGender(gender, btn) {
  currentGender = gender;
  document.querySelectorAll('.gender-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateAvailableSizesByGender(gender);
  applyGenderFit(0.5);
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let touchStartX = 0;

container.addEventListener('pointerdown', (e) => {
  touchStartX = e.clientX;
});

container.addEventListener('pointerup', (e) => {
  const deltaX = e.clientX - touchStartX;
  if (Math.abs(deltaX) > 45 && currentMode === 'carousel') {
    changeShirt(deltaX < 0 ? 1 : -1);
    return;
  }

  if (currentMode !== 'carousel') return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(shirts, true);
  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while (obj.parent && obj.userData.shirtIndex === undefined) {
      obj = obj.parent;
    }
    if (obj.userData.shirtIndex !== undefined) {
      if (obj.userData.shirtIndex === currentIndex) {
        setMode('detail');
      } else {
        currentIndex = obj.userData.shirtIndex;
        updatePositions(0.75);
      }
    }
  }
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  shirts.forEach((item, i) => {
    item.position.y += Math.sin(t * 2.0 + i) * 0.0006;
  });
  camera.lookAt(cameraTarget);
  renderer.render(scene, camera);
}

function handleResize() {
  applyViewportDimensions();
  const w = Math.max(container.clientWidth || getSafeWindowSize().vw, 1);
  const h = Math.max(container.clientHeight || getSafeWindowSize().vh, 1);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  updatePositions(0.3);
}

window.addEventListener('resize', handleResize);
window.addEventListener('load', handleResize);
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => handleResize()).observe(container);
}

updateAvailableSizesByGender('hombre');
updatePositions(0);
animate();
</script>
